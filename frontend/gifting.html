<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gifting | Ved Vigyan</title>
    <meta name="description" content="Spiritual gifting ideas: Rudraksha, malas, bracelets and puja essentials. Request a recommendation from Ved Vigyan." />
    <link rel="canonical" href="/gifting.html" />
    <meta name="robots" content="index,follow" />
    <link rel="stylesheet" href="/public/css/style.css" />
    <link rel="stylesheet" href="/public/css/home-luxury.css" />

    <script src="/public/js/cart.js" defer></script>
    <script src="/public/js/wishlist.js" defer></script>
    <script src="/public/js/lead.js" defer></script>
    <script src="/public/js/lux-shell.js" defer></script>
    <script src="/public/js/lux-cards.js" defer></script>
    <script src="/public/js/ui.js" defer></script>
  </head>
  <body class="lux-home" data-lux-shell-inject="true">

    

    <main class="page">
      <div class="container">
        <div class="pagecard">
          <div class="breadcrumbs">Home / Gifting</div>
          <h1 class="section-title" style="margin:0 0 6px">Spiritual Gifting</h1>
          <p class="section-sub" style="margin:0">
            Tell us the occasion and budget—we’ll suggest a thoughtful gift (demo form opens WhatsApp).
          </p>

          <form data-lead-form style="margin-top:12px">
            <div class="formgrid">
              <div class="field">
                <label for="gname">Name *</label>
                <input id="gname" name="name" required />
              </div>
              <div class="field">
                <label for="gphone">Phone *</label>
                <input id="gphone" name="phone" inputmode="tel" required />
              </div>
              <div class="field" style="grid-column:1/-1">
                <label for="ginterest">Interest</label>
                <input id="ginterest" name="interest" placeholder="Example: Birthday gift under ₹1000" />
              </div>
            </div>
            <button class="btn small primary" type="submit" style="margin-top:12px">Get Suggestions</button>
          </form>
        </div>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
