<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="800" height="533" style="background:#ffffff; font-family: Arial, Helvetica, sans-serif;">
  <!-- Background & Outer Border -->
  <rect x="5" y="5" width="790" height="523" rx="16" fill="#ffffff" stroke="#d4af37" stroke-width="4"/>
  <rect x="12" y="12" width="776" height="509" rx="12" fill="none" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- Top Header Banner -->
  <g transform="translate(25, 22)">
    <!-- GRRL Seal Logo -->
    <circle cx="45" cy="45" r="38" fill="#fff" stroke="#8a1a23" stroke-width="3"/>
    <circle cx="45" cy="45" r="32" fill="none" stroke="#8a1a23" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="45" y="32" font-size="9" font-weight="bold" fill="#8a1a23" text-anchor="middle">RUDRAKSHA</text>
    <text x="45" y="44" font-size="14" font-weight="bold" fill="#8a1a23" text-anchor="middle">★ GRRL ★</text>
    <text x="45" y="58" font-size="9" font-weight="bold" fill="#8a1a23" text-anchor="middle">RESEARCH</text>

    <!-- Lab Header Text -->
    <text x="100" y="38" font-size="28" font-weight="900" fill="#8a1a23" letter-spacing="-0.5">Gems &amp; Rudraksha Research Lab.</text>
    <text x="100" y="60" font-size="16" font-weight="bold" fill="#555555">( Goverment Acknowledged )</text>

    <!-- ISO Badge (Blue Circle) -->
    <g transform="translate(560, 5)">
      <circle cx="35" cy="35" r="32" fill="#1b4980" stroke="#0d2c52" stroke-width="2"/>
      <circle cx="35" cy="35" r="28" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <text x="35" y="28" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">CERTIFIED</text>
      <text x="35" y="40" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">ISO 9001</text>
      <text x="35" y="52" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">COMPANY</text>
    </g>

    <!-- IAF Badge (Blue Oval) -->
    <g transform="translate(645, 10)">
      <ellipse cx="45" cy="30" rx="40" ry="26" fill="#0c4a7c" stroke="#072b49" stroke-width="2"/>
      <text x="45" y="28" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">IAF</text>
      <text x="45" y="42" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">ACCREDITATION FORUM</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="25" y1="115" x2="775" y2="115" stroke="#d4af37" stroke-width="2"/>

  <!-- Left Vertical "LAB TESTED" Red Badge -->
  <g transform="translate(30, 135)">
    <rect x="0" y="0" width="36" height="270" rx="6" fill="#8a1a23"/>
    <text x="-135" y="24" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="4" transform="rotate(-90)" text-anchor="middle">LAB TESTED</text>
  </g>

  <!-- QR Code & VNO Box -->
  <g transform="translate(85, 135)">
    <!-- QR Code Visual -->
    <rect x="0" y="0" width="160" height="160" rx="8" fill="#ffffff" stroke="#222" stroke-width="2"/>
    <!-- QR Pattern -->
    <rect x="12" y="12" width="44" height="44" fill="#000"/>
    <rect x="20" y="20" width="28" height="28" fill="#fff"/>
    <rect x="26" y="26" width="16" height="16" fill="#000"/>

    <rect x="104" y="12" width="44" height="44" fill="#000"/>
    <rect x="112" y="20" width="28" height="28" fill="#fff"/>
    <rect x="118" y="26" width="16" height="16" fill="#000"/>

    <rect x="12" y="104" width="44" height="44" fill="#000"/>
    <rect x="20" y="112" width="28" height="28" fill="#fff"/>
    <rect x="26" y="118" width="16" height="16" fill="#000"/>

    <!-- QR Data Blocks -->
    <path d="M65 15h30v10H65zM65 32h15v20H65zM85 40h20v15H85zM15 65h40v15H15zM65 65h20v40H65zM90 65h35v15H90zM15 90h40v10H15zM90 90h15v35H90zM110 90h35v15H110zM65 115h20v30H65zM115 115h30v30H115z" fill="#000"/>

    <!-- VNO Code -->
    <text x="80" y="192" font-size="16" font-weight="900" fill="#8a1a23" text-anchor="middle">VNO : R671909D524</text>
  </g>

  <!-- Middle Gold Starburst Seal -->
  <g transform="translate(285, 140)">
    <circle cx="75" cy="75" r="70" fill="#d4af37" stroke="#b38f24" stroke-width="3"/>
    <circle cx="75" cy="75" r="62" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 2"/>
    <circle cx="75" cy="75" r="54" fill="#b38f24"/>
    <text x="75" y="48" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">GUARANTEED</text>
    <text x="75" y="78" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">100%</text>
    <text x="75" y="98" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">SATISFACTION</text>
    <rect x="10" y="106" width="130" height="22" rx="4" fill="#8a1a23"/>
    <text x="75" y="121" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">GUARANTEED</text>
  </g>

  <!-- Right Side Specification Table -->
  <g transform="translate(455, 135)" font-size="15" fill="#222222">
    <text x="0" y="24" font-weight="bold" fill="#555555">Shape :</text>
    <text x="140" y="24" font-weight="bold" fill="#000000">Round Beads</text>

    <text x="0" y="58" font-weight="bold" fill="#555555">Color :</text>
    <text x="140" y="58" font-weight="bold" fill="#000000">Black & Brown / Silver</text>

    <text x="0" y="92" font-weight="bold" fill="#555555">Measurement :</text>
    <text x="140" y="92" font-weight="bold" fill="#000000">8mm / 108 Beads</text>

    <text x="0" y="126" font-weight="bold" fill="#555555">Mounted :</text>
    <text x="140" y="126" font-weight="bold" fill="#000000">Mounted / Natural</text>

    <text x="0" y="160" font-weight="bold" fill="#555555">Xrays :</text>
    <text x="140" y="160" font-weight="bold" fill="#000000">Ebony Wood & Rudraksha</text>

    <text x="0" y="194" font-weight="bold" fill="#555555">Created Faces :</text>
    <text x="140" y="194" font-weight="bold" fill="#000000">Natural Faces</text>

    <text x="0" y="228" font-weight="bold" fill="#555555">Test :</text>
    <text x="140" y="228" font-weight="bold" fill="#000000">Microscopic Observation</text>

    <text x="0" y="262" font-weight="bold" fill="#555555">Comments :</text>
    <text x="140" y="262" font-weight="bold" fill="#8a1a23">All Beads are Natural</text>
  </g>

  <!-- Bottom Dark Red Header Bar -->
  <g transform="translate(20, 430)">
    <rect x="0" y="0" width="760" height="65" rx="10" fill="#8a1a23" stroke="#6e131b" stroke-width="2"/>
    <text x="380" y="42" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      Identified As :  Karungali Rudraksha Silver Cap Mala
    </text>
  </g>
</svg>