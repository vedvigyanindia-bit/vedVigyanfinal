<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bracelet | Ved Vigyan</title>
    <meta
      name="description"
      content="Explore bracelet details, traditional usage notes, and styling guidance at Ved Vigyan."
    />
    <link rel="canonical" href="/bracelet/product.html" />
    <meta name="robots" content="index,follow" />
    <link rel="stylesheet" href="/public/css/style.css" />
    <link rel="stylesheet" href="/public/css/home-luxury.css" />

    <script src="/public/js/data.js" defer></script>
    <script src="/public/js/carousel.js" defer></script>
    <script src="/public/js/cart.js" defer></script>
    <script src="/public/js/wishlist.js" defer></script>
    <script src="/public/js/lux-shell.js" defer></script>
    <script src="/public/js/lux-cards.js" defer></script>
    <script src="/public/js/ui.js" defer></script>
    <script src="/public/js/product.js" defer></script>
  </head>
  <body class="lux-home" data-lux-shell-inject="true">

    

    <main class="page">
      <div class="container">
        <div class="pagecard">
          <div class="breadcrumbs">
            <a href="/index.html">Home</a> / <a href="/shop.html">Shop</a> / Bracelet / Product
          </div>

          <div class="product-layout">
            <div class="product-img">
              <img id="productImg" src="/public/images/products/bracelet-rudraksha.svg" alt="Bracelet" width="520" height="320" />
            </div>

            <div>
              <h1 class="product-title" id="productTitle">Bracelet</h1>
              <p class="sub" id="productDesc" style="margin-top:10px">
                Product details, styling notes, and traditional-use guidance will appear here.
              </p>
              <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:10px">
                <div class="price" id="productPrice">₹0</div>
                <button class="btn primary" id="addToCartBtn" type="button">Add to Cart</button>
                <button class="btn wishbtn" type="button" aria-label="Add to wishlist">♡</button>
                <a class="btn" href="/shop.html">Back to Shop</a>
              </div>
              <h2 class="section-title" style="margin:18px 0 8px; font-size:18px">Details</h2>
              <ul class="bullets" id="productBullets"></ul>
              <div class="chakra" style="margin-top:12px">
                <b>Tip:</b> Bracelet choices work best when they match both your intention and your everyday comfort.
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
